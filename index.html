<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css" />
    <link rel="<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Weather-Forecast</title>
</head>
<body>
    <div class="weather">
   <header>
    <form class="search-form">
        <input type="search" placeholder="Enter city name..." required class="search-form-input" />
        <input type="submit" value="search" class="search-form-button" />
    </form>
</header>
<main>
    <div class="weather-search-app">
    <div>
  <h1 class="weather-search-city">Nairobi</h1>
  <p class="weather-search-details">
    Saturday 12:10, partially cloudy
    <br />
    Humidity: <strong>60%</strong>, Wind: <strong>5km/h</strong>
  </p>
  </div>
  <div class="weather-search-info">
  <div class="weather-search-icon">⛅</div>
  <div class="weather-search-temperature">20</div>
  <div class="weather-search-unit">°C</div>
  
     </div>
  </div>
  </main>
  <footer>This project was coded by
    <a href="https://github.com/itotijoy-a11y/" target="_blank">Joyce Korir</a> is
    <a href="https://github.com/itotijoy-a11y/Weather-Forecast" target="_blank">open-sourced on Github</a> and
    <a href ="https://weather-forecast-joyce.netlify.app/" target="_blank">hosted on Netlify</a>
    </footer>
    </div>  
</body>
</html>
